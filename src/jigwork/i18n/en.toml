# English messages. Every key here must exist in tr.toml with the same {placeholders}
# (tests/unit/test_i18n.py checks this).

[cli]
description = "Make a small local LLM do reliable software work: small tasks, a locked-down agent, sandboxed checks."
usage = "usage: "
positionals = "positional arguments"
options = "options"
commands = "commands"
command_metavar = "<command>"
help = "show this help message and exit"
version = "show the version and exit"
error = "{prog}: error: {message}"

[lang]
help = "show or set the interface language"
arg = "en, tr, or auto (follow the system locale)"
current = "Language: {name} ({source})"
saved = "Language set to {name}. Saved in {path}"
auto = "Language follows the system locale again: {name}"
env_overrides = "Note: {var}={value} is set and takes precedence over this setting."
source_env = "from the {var} environment variable"
source_config = "saved in {path}"
source_locale = "from the system locale, {detail}"
source_default = "default"

[config]
unreadable = "Cannot read {path}: {error}"

[tasks]
help = "work with docs/TASKS.md"
lint_help = "check docs/TASKS.md for mistakes before running"
path = "the task file (default: docs/TASKS.md)"
unreadable = "Cannot read {path}: {error}"
severity_error = "error"
severity_warning = "warning"
summary = "tasks: {tasks}, errors: {errors}, warnings: {warnings}"

[tasks.lint]
bad_heading = "looks like a task heading but is not '## T<number>: <title>': {text}"
duplicate_id = "the same id is already used on line {first}"
unknown_status = "unknown status '{value}' ({allowed})"
unknown_type = "unknown type '{value}' ({allowed})"
empty_task = "'task:' is empty"
no_acceptance = "'acceptance:' has no items"
no_files = "no 'files:' listed; the agent gets no file hints and changes cannot be compared"
path_outside = "file path must be relative and stay inside the project: {path}"
no_tasks = "no tasks found (headings look like '## T1: <title>')"

[ui]
default_yes = "[Y/n]"
default_no = "[y/N]"
yes_words = "y,yes"

[check]
"qwen.tools_disabled" = "tools.disabled must include run_shell_command, monitor, agent and task_stop"
"qwen.execution_sandbox" = "tools.executionSandbox must be bwrap, workspace-write, network closed"
"qwen.deny_rules" = "permissions.deny must protect .git, agent settings, control files, .env*"
"qwen.memory_off" = "background memory and auto-skill should be off (they double the work)"
"qwen.bundled_skills_off" = "bundled skills should be off (they double the system prompt)"

[setup]
help = "write the agent's user settings (the old file is backed up first)"
written = "Qwen Code settings written: {path}"
merged = "Qwen Code settings updated: {path} (previous version: {backup})"
left_alone = "Not touched. Fix the file or move it away, then run: jigw setup"

[chat]
help = "interactive agent session with the same restrictions"
args = "arguments passed on to qwen"
no_yolo = "yolo mode is disabled in this setup: {args}"
no_bwrap = "bubblewrap (bwrap) is not installed, so the agent sandbox cannot work. Install it, e.g.: sudo pacman -S bubblewrap"
no_agent = "qwen (Qwen Code) was not found on PATH."
insecure = "Security settings are missing in {path}:"
run_setup = "Run: jigw setup"
wrong_dir = "Not starting in your home folder or in /. Change to a project folder first."
not_git = "This is not a git repository, so changes could not be undone. Not starting. (git init first.)"
home_repo = "This folder is inside a git repository at {path}, which contains your home folder. Not starting."
dirty = "There are uncommitted changes. If the agent breaks something, they get mixed in:"
dirty_confirm = "Continue anyway?"
cancelled = "Cancelled. Commit first: git add -A; and git commit -m 'save'"
no_agents_md = "Note: there is no AGENTS.md here; the agent gets no project rules."
server_down = "The model server does not answer at {url}. Start it (for now: qwen-sunucu baslat) and try again."
git_changed = "WARNING: .git/config or .git/hooks changed during the session. These files can run commands outside the sandbox on your next git command."
restore_confirm = "Restore them?"
restored = ".git/config and .git/hooks were restored."
not_restored = "Left as is. Inspect {path} before running any git command."

[time]
seconds = "{s}s"
minutes = "{m}m {s}s"

[run]
help = "work through the pending tasks in docs/TASKS.md, one fresh agent session each"
one = "run only the next task"
resume_help = "continue the task that stopped for commands you had to run (NEEDS)"
check_help = "run the project's checks in the sandbox against the current code"
status_help = "show the task list"
not_git = "Not inside a git project."
bad_config = "Cannot use the project config {path}: {error}"
no_tasks_file = "{path} does not exist. Is this a jigwork project?"
no_tasks = "No tasks in docs/TASKS.md (the example inside the comment does not count)."
resume_pending = "A task is waiting to be resumed. First: jigw resume   (to give up: git stash -u; rm {path})"
dirty = "There are uncommitted changes:\n  {files}\nCommit or stash them first: git add -A; and git commit -m 'save'"
work_dir_not_ignored = "{path} is not in .gitignore; logs and patches would be committed. Add this line to .gitignore and commit: {path}"
nothing_pending = "No pending tasks. Add new tasks to docs/TASKS.md with 'status: pending'."
all_done = "No pending tasks left."
blocked = "{id} is '{status}'; the tasks after it may depend on it. In docs/TASKS.md:\n  to retry it (made smaller or clearer):  status: pending\n  to skip it and go on:                   status: skip\nCommit the change, then run again: jigw run"
task_invalid = "{id} is not complete. See: jigw tasks lint"
no_resume = "No task is waiting to be resumed."
resume_task_gone = "{id} is no longer in docs/TASKS.md."
resume_note = "A task is waiting to be resumed: {id}  →  jigw resume"
task_header = "\n━━ {id}: {title}  (type: {type})"
agent_working = "── Attempt {attempt}/{attempts}: the agent is working (each step shows below)"
agent_fixing = "── Attempt {attempt}/{attempts}: the agent is fixing the failure"
tool = "   [{seconds}] {name} {target}"
agent_unfinished = "The agent session did not finish cleanly: {error}"
agent_done = "   Agent finished ({seconds}, {tools} tool calls)"
report = "   Report: {text}"
doubts = "Doubts: {text}"
outside_files = "Files not listed in the task changed too: {paths}"
checking = "── Checks (in the sandbox, no network)"
preparing_env = "Preparing the test environment ({deps}); this needs internet..."
autofix_applied = "   ~ auto-fix applied (formatting / import order)"
check_passed = "   {name} ({seconds})"
check_failed = "   {name} ({seconds}, exit {code})"
check_output = "\n{output}"
no_checks = "This project defines no checks; the task is accepted on the agent's word."
protected_restored_agent = "The agent changed protected files; restored: {paths}"
protected_restored_checks = "The checks changed protected files; restored: {paths}"
prepare_failed = "Could not prepare the test environment: {error}"
git_tampered = "SECURITY: .git/config or .git/hooks changed during the agent session ({names}).\nDo not run any git command before inspecting {path}. The run was stopped."
git_restored_after_interrupt = "The agent had changed .git/config or .git/hooks; they were restored before stopping."
task_done = "{id} done (attempt {attempt}, {seconds}) and committed."
task_failed = "{id} failed: {reason}"
failed_patch = "   The agent's last version is in a patch: {patch}\n   To look at it:  git apply {patch}"
failed_hint = "   Check output and logs: {logs}/\n   Make the task smaller or clearer and set 'status: pending' to try again."
needs_intro = "For {id} the agent asks you to run these commands:"
needs_command = "{command}"
needs_hint = "\n   These run with YOUR rights, OUTSIDE the sandbox: read them first, run them only if you understand them.\n   If a Python package is needed, add it to 'dependencies' in pyproject.toml instead of pip install;\n   jigwork installs it into the test environment itself.\n   The agent's changes stay in place (git status). When ready:  jigw resume\n   To give up:  git stash -u; and rm {path}"
commit_failed = "Could not commit. Is your git identity set?\n  git config --global user.name 'Your Name'\n  git config --global user.email 'you@example.com'\n{error}"
interrupted = "Stopped. The agent's partial changes may still be there:\n   to look:        git status\n   to put aside:   git stash -u"
