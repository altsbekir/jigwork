[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: basic errors, B: likely bugs, I: import order, UP: modern Python
select = ["E", "F", "B", "I", "UP"]
