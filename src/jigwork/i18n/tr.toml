resume_task_gone = "{id} artık docs/TASKS.md içinde yok."
resume_note = "Sürdürülmeyi bekleyen görev var: {id}  →  jigw resume"
task_header = "\n━━ {id}: {title}  (tip: {type})"
agent_working = "── Deneme {attempt}/{attempts}: ajan çalışıyor (her adım aşağıda görünür)"
agent_fixing = "── Deneme {attempt}/{attempts}: ajan hatayı düzeltiyor"
tool = "   [{seconds}] {name} {target}"
agent_unfinished = "Ajan oturumu düzgün bitmedi: {error}"
agent_done = "   Ajan bitti ({seconds}, {tools} araç çağrısı)"
report = "   Rapor: {text}"
doubts = "Şüpheler: {text}"
outside_files = "Görevde listelenmeyen dosyalar da değişti: {paths}"
checking = "── Kontroller (ağsız kutuda)"
preparing_env = "Test ortamı hazırlanıyor ({deps}); internet gerekir..."
autofix_applied = "   ~ otomatik düzeltme uygulandı (biçim / import sırası)"
check_passed = "   {name} ({seconds})"
check_failed = "   {name} ({seconds}, çıkış {code})"
check_output = "\n{output}"
no_checks = "Bu projede kontrol tanımlı değil; görev ajanın sözüne güvenilerek kabul edilecek."
protected_restored_agent = "Ajan korunan dosyaları değiştirdi; geri alındı: {paths}"
protected_restored_checks = "Kontroller korunan dosyaları değiştirdi; geri alındı: {paths}"
prepare_failed = "Test ortamı hazırlanamadı: {error}"
git_tampered = "GÜVENLİK: Ajan oturumu sırasında .git/config ya da .git/hooks değişti ({names}).\n{path} incelenmeden hiçbir git komutu çalıştırma. Çalışma durduruldu."
git_restored_after_interrupt = "Ajan .git/config ya da .git/hooks dosyalarını değiştirmişti; durmadan önce eski hallerine döndürüldü."
task_done = "{id} tamam ({attempt}. deneme, {seconds}) ve commit atıldı."
