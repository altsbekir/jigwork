[project]
name = "{{PROJE_ADI}}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: temel hatalar, B: olası buglar, I: import sırası, UP: modern Python
select = ["E", "F", "B", "I", "UP"]
