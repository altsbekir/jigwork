# Türkçe iletiler. Anahtarlar ve {yer tutucular} en.toml ile aynı olmalı.

[cli]
description = "Küçük bir yerel LLM'e güvenilir yazılım işi yaptırır: küçük görevler, kısıtlı ajan, kutuda kontroller."
usage = "kullanım: "
positionals = "konumsal argümanlar"
options = "seçenekler"
commands = "komutlar"
command_metavar = "<komut>"
help = "bu yardım iletisini göster ve çık"
version = "sürümü göster ve çık"
error = "{prog}: hata: {message}"

[lang]
help = "arayüz dilini göster veya ayarla"
arg = "en, tr veya auto (sistem diline uy)"
current = "Dil: {name} ({source})"
saved = "Dil {name} olarak ayarlandı. Kayıt yeri: {path}"
auto = "Dil yeniden sistem dilini izliyor: {name}"
env_overrides = "Not: {var}={value} tanımlı ve bu ayarın önüne geçiyor."
source_env = "{var} ortam değişkeninden"
source_config = "{path} dosyasında kayıtlı"
source_locale = "sistem dilinden, {detail}"
source_default = "varsayılan"

[config]
unreadable = "{path} okunamıyor: {error}"

[tasks]
help = "docs/TASKS.md ile çalış"
lint_help = "çalıştırmadan önce docs/TASKS.md'yi hatalara karşı denetle"
path = "görev dosyası (varsayılan: docs/TASKS.md)"
unreadable = "{path} okunamıyor: {error}"
severity_error = "hata"
severity_warning = "uyarı"
summary = "görev: {tasks}, hata: {errors}, uyarı: {warnings}"

[tasks.lint]
bad_heading = "görev başlığına benziyor ama '## T<numara>: <başlık>' biçiminde değil: {text}"
duplicate_id = "aynı kimlik {first}. satırda zaten kullanılmış"
unknown_status = "bilinmeyen durum '{value}' ({allowed})"
unknown_type = "bilinmeyen tip '{value}' ({allowed})"
empty_task = "'task:' boş"
no_acceptance = "'acceptance:' altında madde yok"
no_files = "'files:' listesi yok; ajana dosya ipucu verilemez, değişiklikler karşılaştırılamaz"
path_outside = "dosya yolu göreli olmalı ve proje içinde kalmalı: {path}"
no_tasks = "görev bulunamadı (başlıklar '## T1: <başlık>' biçiminde olmalı)"

[ui]
default_yes = "[E/h]"
default_no = "[e/H]"
yes_words = "e,evet,y,yes"

[check]
"qwen.tools_disabled" = "tools.disabled içinde run_shell_command, monitor, agent ve task_stop olmalı"
"qwen.execution_sandbox" = "tools.executionSandbox bwrap, workspace-write, ağ kapalı olmalı"
"qwen.deny_rules" = "permissions.deny .git'i, ajan ayarlarını, kontrol dosyalarını ve .env* dosyalarını korumalı"
"qwen.memory_off" = "arka plan hafızası ve otomatik skill kapalı olmalı (işi ikiye katlıyorlar)"
"qwen.bundled_skills_off" = "hazır gelen skill'ler kapalı olmalı (sistem promptunu ikiye katlıyorlar)"

[setup]
help = "ajanın kullanıcı ayarlarını yaz (eski dosya önce yedeklenir)"
written = "Qwen Code ayarı yazıldı: {path}"
merged = "Qwen Code ayarı güncellendi: {path} (eski hali: {backup})"
left_alone = "Dokunulmadı. Dosyayı düzelt ya da başka yere taşı, sonra: jigw setup"

[chat]
help = "aynı kısıtlamalarla etkileşimli ajan oturumu"
args = "qwen'e aynen geçirilen argümanlar"
no_yolo = "Bu kurulumda yolo modu kapalı: {args}"
no_bwrap = "bubblewrap (bwrap) kurulu değil, ajan sandbox'ı çalışamaz. Kur, örneğin: sudo pacman -S bubblewrap"
no_agent = "qwen (Qwen Code) PATH'te bulunamadı."
insecure = "{path} içinde güvenlik ayarları eksik:"
run_setup = "Çalıştır: jigw setup"
wrong_dir = "Ev klasöründe ya da kökte açmıyorum. Önce bir proje klasörüne geç."
not_git = "Burası bir git deposu değil; değişiklikler geri alınamaz. Açmıyorum. (Önce git init.)"
home_repo = "Bu klasör {path} konumundaki, ev klasörünü de içeren bir git deposunun içinde. Açmıyorum."
dirty = "Commit edilmemiş değişiklikler var. Ajan bir şeyi bozarsa bunlar karışabilir:"
dirty_confirm = "Yine de devam edilsin mi?"
cancelled = "Vazgeçildi. Önce commit at: git add -A; and git commit -m 'kayıt'"
no_agents_md = "Not: burada AGENTS.md yok; ajan proje kurallarını almayacak."
server_down = "Model sunucusu {url} adresinde yanıt vermiyor. Başlat (şimdilik: qwen-sunucu baslat) ve tekrar dene."
git_changed = "DİKKAT: Oturum sırasında .git/config ya da .git/hooks değişti. Bu dosyalar bir sonraki git komutunda sandbox dışında komut çalıştırabilir."
restore_confirm = "Eski haline döndürülsün mü?"
restored = ".git/config ve .git/hooks eski haline döndürüldü."
not_restored = "Dokunulmadı. Herhangi bir git komutu çalıştırmadan önce incele: {path}"

[time]
seconds = "{s}sn"
minutes = "{m}dk {s}sn"

[run]
help = "docs/TASKS.md'deki bekleyen görevleri her biri yeni bir ajan oturumunda sırayla çalıştır"
one = "yalnızca sıradaki görevi çalıştır"
resume_help = "çalıştırman gereken komutlar (NEEDS) için duran görevi sürdür"
check_help = "projenin kontrollerini şu anki koda karşı kutuda çalıştır"
status_help = "görev listesini göster"
not_git = "Bir git projesinin içinde değilsin."
bad_config = "Proje ayarı {path} kullanılamıyor: {error}"
no_tasks_file = "{path} yok. Bu bir jigwork projesi mi?"
no_tasks = "docs/TASKS.md içinde görev yok (yorum içindeki örnek sayılmaz)."
resume_pending = "Sürdürülmeyi bekleyen bir görev var. Önce: jigw resume   (vazgeçmek için: git stash -u; rm {path})"
dirty = "Commit edilmemiş değişiklikler var:\n  {files}\nÖnce commit at ya da kenara koy: git add -A; and git commit -m 'kayıt'"
work_dir_not_ignored = "{path} .gitignore içinde değil; loglar ve yamalar commit'e girer. Bu satırı .gitignore'a ekleyip commit et: {path}"
nothing_pending = "Bekleyen görev yok. Yeni görevleri docs/TASKS.md'ye 'status: pending' ile ekle."
all_done = "Bekleyen görev kalmadı."
